# ソース記事: AWS SAM #6 — REST APIアプリを構築してCI/CDパイプラインまで通してみる
# 環境別設定（dev / staging / prod）

version = 0.1

# 開発環境
[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
stack_name = "sam-items-api-dev"
resolve_s3 = true
s3_prefix = "sam-items-api-dev"
region = "ap-northeast-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
parameter_overrides = "Stage=dev"

[default.local_invoke.parameters]
env_vars = "env-local.json"

[default.sync.parameters]
watch = true

# ステージング環境
[staging.deploy.parameters]
stack_name = "sam-items-api-staging"
resolve_s3 = true
s3_prefix = "sam-items-api-staging"
region = "ap-northeast-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
parameter_overrides = "Stage=staging"

# 本番環境
[prod.deploy.parameters]
stack_name = "sam-items-api-prod"
resolve_s3 = true
s3_prefix = "sam-items-api-prod"
region = "ap-northeast-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
parameter_overrides = "Stage=prod"
disable_rollback = false

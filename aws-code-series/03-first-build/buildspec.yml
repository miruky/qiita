version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "=== Install Phase ==="
      - echo "Installing dependencies..."
      - pip install -r requirements.txt

  pre_build:
    commands:
      - echo "=== Pre Build Phase ==="
      - echo "Running tests..."
      - python -m pytest test_app.py -v || python -m unittest test_app -v

  build:
    commands:
      - echo "=== Build Phase ==="
      - echo "Build started on $(date)"
      - python app.py

  post_build:
    commands:
      - echo "=== Post Build Phase ==="
      - echo "Build completed on $(date)"

artifacts:
  files:
    - '**/*'
  name: build-output-$(date +%Y-%m-%d)

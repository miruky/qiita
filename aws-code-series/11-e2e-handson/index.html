<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Code Series Handson</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AWS Code Series</h1>
            <p class="subtitle">CI/CD Pipeline Demo</p>
        </header>
        
        <main>
            <div class="info-card">
                <h2>Application Info</h2>
                <table>
                    <tr><td>Version</td><td id="version">1.0.0</td></tr>
                    <tr><td>Environment</td><td id="environment">Production</td></tr>
                    <tr><td>Deploy Time</td><td id="deploy-time">-</td></tr>
                    <tr><td>Status</td><td id="status">Running</td></tr>
                </table>
            </div>
            
            <div class="info-card">
                <h2>Pipeline Steps</h2>
                <div class="pipeline">
                    <div class="step completed">Source<br><small>GitHub</small></div>
                    <div class="arrow">&rarr;</div>
                    <div class="step completed">Build<br><small>CodeBuild</small></div>
                    <div class="arrow">&rarr;</div>
                    <div class="step completed">Deploy<br><small>CodeDeploy</small></div>
                </div>
            </div>
        </main>
        
        <footer>
            <p>Powered by AWS CodePipeline</p>
        </footer>
    </div>
    <script src="js/app.js"></script>
</body>
</html>

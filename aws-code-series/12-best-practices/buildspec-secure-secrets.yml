version: 0.2

env:
  # 悪い例：平文で記述
  # variables:
  #   DB_PASSWORD: "mypassword123"
  
  # 良い例：Parameter Storeから取得
  parameter-store:
    DB_HOST: "/app/production/db-host"
    API_KEY: "/app/production/api-key"
  
  # 良い例：Secrets Managerから取得
  secrets-manager:
    DB_PASSWORD: "prod/db-credentials:password"

phases:
  build:
    commands:
      # シークレットはログに出力しない
      - echo "Connecting to database..." 
      # echo $DB_PASSWORD はNG

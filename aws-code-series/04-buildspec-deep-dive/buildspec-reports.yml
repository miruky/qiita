version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install -r requirements.txt

  pre_build:
    commands:
      - echo "Running tests with JUnit report..."
      - python -m pytest test_app.py -v --junitxml=reports/test-results.xml
    finally:
      - echo "Tests completed"

  build:
    commands:
      - echo "Build phase"
      - python app.py

reports:
  pytest-reports:
    files:
      - 'test-results.xml'
    base-directory: reports
    file-format: JUNITXML

artifacts:
  files:
    - '**/*'

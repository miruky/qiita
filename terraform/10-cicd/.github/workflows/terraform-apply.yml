name: "Terraform Apply"

on:
  push:
    branches:
      - main
    paths:
      - "environments/**"
      - "modules/**"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  TF_VERSION: "1.7.0"

jobs:
  # ========== dev 環境 ==========
  apply-dev:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend-config=../envs/dev.backend.hcl

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file=../envs/dev.tfvars

  # ========== stg 環境 ==========
  apply-stg:
    needs: apply-dev
    runs-on: ubuntu-latest
    environment: stg
    defaults:
      run:
        working-directory: environments/stg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend-config=../envs/stg.backend.hcl

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file=../envs/stg.tfvars

  # ========== prod 環境 ==========
  apply-prod:
    needs: apply-stg
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: environments/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend-config=../envs/prod.backend.hcl

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file=../envs/prod.tfvars

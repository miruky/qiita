# .github/workflows/terraform-plan.yml（完全版）
name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'environments/**'
      - 'modules/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.14.6"
  AWS_REGION: "ap-northeast-1"

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff
        continue-on-error: false

  plan:
    name: Plan (${{ matrix.environment }})
    needs: format-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, stg, prod]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false  # plan 出力のキャプチャ用

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -no-color

      - name: Terraform Validate
        working-directory: environments/${{ matrix.environment }}
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        working-directory: environments/${{ matrix.environment }}
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode -out=tfplan 2>&1 | tee plan.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exitcode=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Plan Artifact
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: environments/${{ matrix.environment }}/tfplan
          retention-days: 5

      - name: Post Plan to PR
        uses: actions/github-script@v7
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout || '' }}
          EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
          ENVIRONMENT: ${{ matrix.environment }}
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(
              `environments/${process.env.ENVIRONMENT}/plan.txt`, 'utf8'
            );
            
            const exitCode = process.env.EXIT_CODE;
            const icons = { '0': '✅', '1': '❌', '2': '⚠️' };
            const labels = { '0': 'No Changes', '1': 'Error', '2': 'Changes Detected' };
            
            const body = [
              `### ${icons[exitCode]} Terraform Plan: \`${process.env.ENVIRONMENT}\` — ${labels[exitCode]}`,
              '',
              '<details><summary>Show Plan Output</summary>',
              '',
              '```',
              plan.length > 60000 ? '...(truncated)\n' + plan.slice(-60000) : plan,
              '```',
              '',
              '</details>'
            ].join('\n');
            
            // 既存のコメントを更新
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const marker = `Terraform Plan: \`${process.env.ENVIRONMENT}\``;
            const existing = comments.find(c => c.body.includes(marker));
            
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Fail on Error
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

# ============================================================
# AWS CloudFormation シリーズ #2
# VPC ネットワーク構築 — VPC + パブリックサブネット×2 + IGW + ルートテーブル
# ============================================================
AWSTemplateFormatVersion: '2010-09-09'
Description: VPC Network with 2 Public Subnets, IGW, and Route Table

# ============================================================
# Metadata - コンソール表示のカスタマイズ
# ============================================================
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: ネットワーク設定
        Parameters:
          - VpcCIDR
          - PublicSubnet1CIDR
          - PublicSubnet2CIDR
      - Label:
          default: 共通設定
        Parameters:
          - ProjectName
          - EnvironmentName
    ParameterLabels:
      VpcCIDR:
        default: VPCのCIDRブロック
      PublicSubnet1CIDR:
        default: パブリックサブネット1のCIDR
      PublicSubnet2CIDR:
        default: パブリックサブネット2のCIDR

# ============================================================
# Parameters - 入力パラメータ
# ============================================================
Parameters:
  ProjectName:
    Type: String
    Default: cfn-handson
    Description: プロジェクト名（リソース命名に使用）

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, production]
    Description: 環境名

  VpcCIDR:
    Type: String
    Default: '10.0.0.0/16'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    Description: VPCのCIDRブロック

  PublicSubnet1CIDR:
    Type: String
    Default: '10.0.1.0/24'
    Description: パブリックサブネット1のCIDR

  PublicSubnet2CIDR:
    Type: String
    Default: '10.0.2.0/24'
    Description: パブリックサブネット2のCIDR

# ============================================================
# Mappings - AZ設定
# ============================================================
Mappings:
  AZConfig:
    ap-northeast-1:
      AZ1: ap-northeast-1a
      AZ2: ap-northeast-1c
    ap-northeast-3:
      AZ1: ap-northeast-3a
      AZ2: ap-northeast-3b
    us-east-1:
      AZ1: us-east-1a
      AZ2: us-east-1b

# ============================================================
# Resources - リソース定義
# ============================================================
Resources:
  # ────────────────────────
  # VPC
  # ────────────────────────
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-vpc'

  # ────────────────────────
  # Internet Gateway
  # ────────────────────────
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-igw'

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  # ────────────────────────
  # Public Subnets
  # ────────────────────────
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !FindInMap [AZConfig, !Ref 'AWS::Region', AZ1]
      CidrBlock: !Ref PublicSubnet1CIDR
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-public-1a'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !FindInMap [AZConfig, !Ref 'AWS::Region', AZ2]
      CidrBlock: !Ref PublicSubnet2CIDR
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-public-1c'

  # ────────────────────────
  # Route Table
  # ────────────────────────
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-public-rt'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

# ============================================================
# Outputs - 出力値
# ============================================================
Outputs:
  VPCId:
    Description: VPC ID
    Value: !Ref VPC

  PublicSubnet1Id:
    Description: Public Subnet 1 ID
    Value: !Ref PublicSubnet1

  PublicSubnet2Id:
    Description: Public Subnet 2 ID
    Value: !Ref PublicSubnet2

  InternetGatewayId:
    Description: Internet Gateway ID
    Value: !Ref InternetGateway
